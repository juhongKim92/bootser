<style>
/* ============================================================
   실험대
   ============================================================ */
.lab{
  margin:32px 0 8px;
  border:1px solid var(--rule);
  border-radius:4px;
  background:var(--paper-2);
  overflow:hidden;
}
.lab section{border-bottom:1px solid var(--rule);padding:16px 18px}
.lab section:last-child{border-bottom:none}

.cap{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-3);
  margin-bottom:10px;
}

/* --- 트랜잭션 축 + horizon --- */
.axis{position:relative;padding-top:22px}
.ticks{display:flex;gap:3px;flex-wrap:wrap}
.tick{
  font-family:var(--mono);font-size:10px;
  min-width:34px;text-align:center;
  padding:4px 2px;
  border:1px solid var(--rule);
  border-radius:2px;
  background:var(--paper);
  color:var(--ink-3);
  position:relative;
}
.tick.reclaimable{background:color-mix(in srgb, var(--free) 16%, var(--paper));color:var(--ink-2)}
.tick.open{border-color:var(--horizon);color:var(--horizon);font-weight:500}
.tick .who{
  position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.1em;color:var(--horizon);white-space:nowrap;
}
.hz{
  display:flex;align-items:center;gap:8px;
  margin-top:10px;
  font-family:var(--mono);font-size:11px;color:var(--horizon);
}
.hz b{font-weight:500}
.hz .bar{flex:1;height:1px;background:var(--horizon);opacity:.4}

/* --- 세션 --- */
.decks{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media (max-width:660px){ .decks{grid-template-columns:1fr} }
.deck{padding:16px 18px;border-right:1px solid var(--rule)}
.deck:last-child{border-right:none}
@media (max-width:660px){
  .deck{border-right:none;border-bottom:1px solid var(--rule)}
  .deck:last-child{border-bottom:none}
}
.deck h3{
  font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  margin:0 0 4px;color:var(--ink-2);
}
.deck .state{
  font-family:var(--mono);font-size:11px;
  color:var(--ink-3);margin-bottom:10px;min-height:17px;
}
.deck .state.on{color:var(--horizon)}
.ops{display:flex;flex-wrap:wrap;gap:5px}
.ops button{padding:5px 8px;font-size:10px}

/* --- 통계 + vacuum --- */
.meters{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end}
.meter{min-width:96px}
.meter .k{
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);display:block;
}
.meter .v{font-family:var(--mono);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter .v small{font-size:11px;color:var(--ink-3)}
.meter.warn .v{color:var(--blocked)}

/* --- 힙 --- */
.pages{display:flex;flex-direction:column;gap:6px}
.page{display:flex;align-items:center;gap:10px}
.page .pno{
  font-family:var(--mono);font-size:10px;color:var(--ink-3);
  width:52px;flex:0 0 52px;
}
.slots{display:flex;gap:3px;flex-wrap:wrap}
.slot{
  width:38px;height:38px;
  border:1px solid var(--rule);
  border-radius:2px;
  background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:8.5px;line-height:1.25;
  color:var(--ink-3);
  transition:background .25s, border-color .25s;
}
.slot.live   {border-color:var(--live);   background:color-mix(in srgb, var(--live) 13%, var(--paper));   color:var(--live)}
.slot.pending{border-color:var(--pending);background:color-mix(in srgb, var(--pending) 12%, var(--paper));color:var(--ink-2); border-style:dashed}
.slot.blocked{border-color:var(--blocked);background:color-mix(in srgb, var(--blocked) 15%, var(--paper));color:var(--blocked)}
.slot.free   {border-color:var(--free);   background:color-mix(in srgb, var(--free) 20%, var(--paper));   color:var(--free)}

.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.legend i{width:10px;height:10px;border:1px solid;border-radius:2px;display:inline-block}
.legend .l-live   i{border-color:var(--live);   background:color-mix(in srgb,var(--live) 13%,var(--paper))}
.legend .l-pending i{border-color:var(--pending);border-style:dashed}
.legend .l-blocked i{border-color:var(--blocked);background:color-mix(in srgb,var(--blocked) 15%,var(--paper))}
.legend .l-free   i{border-color:var(--free);   background:color-mix(in srgb,var(--free) 20%,var(--paper))}

/* --- 로그 --- */

  font-family:var(--mono);font-size:11px;line-height:1.75;

/* --- 조작대 --- */

<script>
'use strict';

/* ============================================================================
 * 0. 문안
 * ========================================================================== */

const T = {
ko:{
  title:'DELETE 했는데 테이블이 줄지 않는 이유',
  lede:'PostgreSQL에서 열려 있는 트랜잭션 하나가 어떻게 VACUUM 전체를 멈춰 세우고 테이블을 부풀리는지, 직접 조작하며 확인합니다.',
  capAxis:'트랜잭션 ID 축',
  capHeap:'힙 — 페이지와 슬롯',
  capLog:'로그',
  hzLabel:'xmin horizon',
  hzNone:'열린 트랜잭션 없음 · 전부 회수 가능',
  hzHeld:'세션 $1 이(가) 붙잡고 있음',
  lgLive:'live', lgPending:'커밋 전', lgBlocked:'dead · 회수 불가', lgFree:'dead · 회수 가능',
  skTop:'위 = xmin · 이 버전을 만든 트랜잭션',
  skBot:'아래 = xmax · 이 버전을 지운 트랜잭션 (— 이면 살아 있음)',
  lgAuto:'세션 $1: (트랜잭션이 없어 BEGIN 자동 실행)',
  mSize:'테이블 크기', mLive:'유효 행', mDead:'죽은 튜플', mBloat:'블로트',
  play:'시나리오 재생', pause:'일시정지', step:'다음 단계', reset:'초기화',
  nIntro:'재생을 누르면 실제 장애 상황이 순서대로 재현됩니다. 중간에 버튼을 직접 눌러 개입해도 됩니다.',
  opBegin:'BEGIN', opSelect:'SELECT', opUpdate:'UPDATE ×3', opDelete:'DELETE ×3', opCommit:'COMMIT',
  idle:'유휴', openNoSnap:'열림 · 스냅샷 없음', openSnap:'열림 · 스냅샷 $1', openXid:'열림 · xid $1 · 스냅샷 $2',
  lgBegin:'세션 $1: BEGIN',
  lgSelect:'세션 $1: SELECT — 스냅샷 $2 획득',
  lgUpdate:'세션 $1: UPDATE $2행 — 구버전 $2개 생성, 신버전 $2개 기록',
  lgDelete:'세션 $1: DELETE $2행',
  lgCommit:'세션 $1: COMMIT',
  lgVacFull:'VACUUM — $1개 회수, $2개 보류',
  lgVacNone:'VACUUM — 회수 0개. horizon($1) 이후의 죽은 튜플은 아직 지울 수 없음',
  lgTrunc:'꼬리 페이지 $1개 절단 — OS에 반환',
  lgNoTrunc:'회수는 됐지만 파일 크기는 그대로. 빈 공간이 재사용 대기 상태로 남음',
  foot:'PostgreSQL 16 기준 · 교육용 단순화 모델'
},
en:{
  title:'Why your table never shrinks after DELETE',
  lede:'How a single open transaction stalls VACUUM and inflates a PostgreSQL table. Drive it yourself and watch it happen.',
  capAxis:'Transaction ID axis',
  capHeap:'Heap — pages and slots',
  capLog:'Log',
  hzLabel:'xmin horizon',
  hzNone:'no open transaction · everything reclaimable',
  hzHeld:'held by session $1',
  lgLive:'live', lgPending:'uncommitted', lgBlocked:'dead · blocked', lgFree:'dead · reclaimable',
  skTop:'top = xmin · transaction that created this version',
  skBot:'bottom = xmax · transaction that killed it (— means still live)',
  lgAuto:'Session $1: (no transaction open — BEGIN issued automatically)',
  mSize:'table size', mLive:'live rows', mDead:'dead tuples', mBloat:'bloat',
  play:'Play scenario', pause:'Pause', step:'Next step', reset:'Reset',
  nIntro:'Press play to replay a real production incident step by step. You can also grab the controls at any time.',
  opBegin:'BEGIN', opSelect:'SELECT', opUpdate:'UPDATE ×3', opDelete:'DELETE ×3', opCommit:'COMMIT',
  idle:'idle', openNoSnap:'open · no snapshot', openSnap:'open · snapshot $1', openXid:'open · xid $1 · snapshot $2',
  lgBegin:'Session $1: BEGIN',
  lgSelect:'Session $1: SELECT — took snapshot $2',
  lgUpdate:'Session $1: UPDATE $2 rows — $2 old versions dead, $2 new versions written',
  lgDelete:'Session $1: DELETE $2 rows',
  lgCommit:'Session $1: COMMIT',
  lgVacFull:'VACUUM — reclaimed $1, held back $2',
  lgVacNone:'VACUUM — reclaimed 0. Dead tuples newer than horizon ($1) cannot be removed yet',
  lgTrunc:'Truncated $1 trailing page(s) — returned to OS',
  lgNoTrunc:'Space reclaimed, file size unchanged. Freed slots are queued for reuse',
  foot:'PostgreSQL 16 · simplified teaching model'
}};

let L = 'ko';
const t = (k, ...a) => {
  let s = T[L][k] ?? k;
  a.forEach((v,i)=> s = s.replaceAll('$'+(i+1), v));
  return s;
};

/* ============================================================================
 * 1. 모델
 *
 *    튜플 하나는 { xmin, xmax } 를 갖는다.
 *      xmin — 이 버전을 만든 트랜잭션
 *      xmax — 이 버전을 지운 트랜잭션 (없으면 null)
 *
 *    죽은 튜플이라고 바로 지울 수 있는 게 아니다. 아직 그 버전을 볼 자격이
 *    있는 트랜잭션이 하나라도 살아 있으면 VACUUM은 손대지 못한다.
 *    그 경계선이 xmin horizon 이다.
 * ========================================================================== */

const SLOTS = 8;          // 페이지당 슬롯
const PAGE_KB = 8;        // 페이지 크기

let st;

function reset(){
  st = {
    nextXid: 101,
    committed: new Set([100]),
    tx: { A: blank(), B: blank() },
    tuples: [],
    pages: 3,
    seq: 0,
    log: [],
    step: 0,
    peakSize: 0,
  };
  for (let i=0;i<16;i++){
    const p = place();
    st.tuples.push({ id: st.seq++, xmin:100, xmax:null, page:p.page, slot:p.slot });
  }
  st.peakSize = size();
}

const blank = () => ({ open:false, xid:null, snap:null });

/** 열린 트랜잭션이 붙잡고 있는 가장 오래된 xid. 없으면 미래를 가리킨다. */
function horizon(){
  const xs = [];
  for (const k of ['A','B']){
    const x = st.tx[k];
    if (!x.open) continue;
    if (x.snap != null) xs.push(x.snap);
    if (x.xid  != null) xs.push(x.xid);
  }
  return xs.length ? Math.min(...xs) : st.nextXid;
}

function holder(){
  const h = horizon();
  for (const k of ['A','B']){
    const x = st.tx[k];
    if (!x.open) continue;
    if (x.snap === h || x.xid === h) return k;
  }
  return null;
}

const isCommitted = x => x != null && st.committed.has(x);

/** live | pending | blocked | free */
function stateOf(tp){
  if (!isCommitted(tp.xmin)) return 'pending';
  if (!isCommitted(tp.xmax)) return 'live';
  return tp.xmax < horizon() ? 'free' : 'blocked';
}

function place(){
  const used = new Set(st.tuples.map(x => x.page*SLOTS + x.slot));
  for (let i=0;i<st.pages*SLOTS;i++) if (!used.has(i)) return { page:Math.floor(i/SLOTS), slot:i%SLOTS };
  st.pages++;
  return { page:st.pages-1, slot:0 };
}

const size    = () => st.pages * PAGE_KB;
const liveN   = () => st.tuples.filter(x => stateOf(x)==='live').length;
const deadN   = () => st.tuples.filter(x => { const s=stateOf(x); return s==='blocked'||s==='free'; }).length;

/* --- 연산 ----------------------------------------------------------------- */

function log(msg, cls){ st.log.push({ msg, cls }); if (st.log.length>60) st.log.shift(); }

function opBegin(k){
  if (st.tx[k].open) return;
  st.tx[k] = { open:true, xid:null, snap:null };
  log(t('lgBegin', k));
}
function takeSnap(k){
  const x = st.tx[k];
  if (x.snap == null) x.snap = st.nextXid;
}
function needXid(k){
  const x = st.tx[k];
  if (x.xid == null) x.xid = st.nextXid++;
  return x.xid;
}
function opSelect(k){
  if (!st.tx[k].open){ log(t('lgAuto', k)); opBegin(k); }
  takeSnap(k);
  log(t('lgSelect', k, st.tx[k].snap));
}
function opWrite(k, n, kind){
  if (!st.tx[k].open){ log(t('lgAuto', k)); opBegin(k); }
  takeSnap(k);
  const xid = needXid(k);
  const targets = st.tuples.filter(x => isCommitted(x.xmin) && x.xmax == null).slice(0, n);
  for (const tp of targets){
    tp.xmax = xid;
    if (kind === 'update'){
      const p = place();
      st.tuples.push({ id: st.seq++, xmin: xid, xmax:null, page:p.page, slot:p.slot });
    }
  }
  log(t(kind === 'update' ? 'lgUpdate' : 'lgDelete', k, targets.length));
  st.peakSize = Math.max(st.peakSize, size());
}
function opCommit(k){
  const x = st.tx[k];
  if (!x.open) return;
  if (x.xid != null) st.committed.add(x.xid);
  st.tx[k] = blank();
  log(t('lgCommit', k));
}

function opVacuum(){
  const h = horizon();
  const before = st.tuples.length;
  const kept = st.tuples.filter(x => stateOf(x) !== 'free');
  const removed = before - kept.length;
  const held = kept.filter(x => stateOf(x) === 'blocked').length;
  st.tuples = kept;

  if (removed === 0) log(t('lgVacNone', h), 'hi');
  else log(t('lgVacFull', removed, held), held ? 'hi' : 'ok');

  // 꼬리 절단 — 뒤쪽 페이지가 완전히 비어야만 OS에 돌려줄 수 있다
  let maxPage = -1;
  for (const x of st.tuples) maxPage = Math.max(maxPage, x.page);
  const canDrop = st.pages - (maxPage + 1);
  if (removed > 0){
    if (canDrop > 0){ st.pages = Math.max(1, maxPage + 1); log(t('lgTrunc', canDrop), 'ok'); }
    else log(t('lgNoTrunc'));
  }
}

 * 2. 시나리오
 * ========================================================================== */

const $ = s => document.querySelector(s);

function render(){
  const h = horizon();

  // 축
  const ticks = [];
  for (let x=100; x<st.nextXid; x++){
    const cls = ['tick'];
    if (x < h) cls.push('reclaimable');
    const who = [];
    for (const k of ['A','B']){
      const s = st.tx[k];
      if (s.open && (s.xid===x || s.snap===x)){ cls.push('open'); who.push(k); }
    }
    ticks.push(`<span class="${cls.join(' ')}">${who.length?`<span class="who">${who.join('\u00b7')}</span>`:''}${x}</span>`);
  }
  if (st.nextXid <= 160)
    ticks.push(`<span class="tick" style="opacity:.45">${st.nextXid}</span>`);
  $('#ticks').innerHTML = ticks.join('');

  $('#hzVal').textContent = h;
  const hd = holder();
  $('#hzWho').textContent = hd ? t('hzHeld', hd) : t('hzNone');

  // 세션
  for (const k of ['A','B']){
    const s = st.tx[k], el = $('#st'+k);
    el.classList.toggle('on', s.open);
    el.textContent = !s.open ? t('idle')
      : s.xid != null ? t('openXid', s.xid, s.snap)
      : s.snap != null ? t('openSnap', s.snap)
      : t('openNoSnap');
  }

  // 힙
  const byPage = Array.from({length:st.pages}, () => new Array(SLOTS).fill(null));
  for (const x of st.tuples) if (x.page < st.pages) byPage[x.page][x.slot] = x;
  $('#pages').innerHTML = byPage.map((slots, p) => `
    <div class="page">
      <span class="pno">page ${p}</span>
      <div class="slots">${slots.map(x => {
        if (!x) return '<div class="slot"></div>';
        const s = stateOf(x);
        return `<div class="slot ${s}"><span>${x.xmin}</span><span>${x.xmax ?? '—'}</span></div>`;
      }).join('')}</div>
    </div>`).join('');

  // 계기
  const dead = deadN();
  $('#mSize').innerHTML = `${size()}<small> KB</small>`;
  $('#mLive').textContent = liveN();
  $('#mDead').textContent = dead;
  $('#mDeadBox').classList.toggle('warn', dead > 0);
  const total = st.tuples.length;
  const bloat = total ? Math.round(dead * 100 / total) : 0;
  $('#mBloat').innerHTML = `${bloat}<small> %</small>`;

  // 로그
  $('#log').innerHTML = st.log.slice(-40)
    .map(e => `<div class="${e.cls||''}">${e.msg}</div>`).join('');
  $('#log').scrollTop = 1e6;

  // 서술
  $('#nStep').textContent = `${String(st.step).padStart(2,'0')} / ${String(SCENE.length-1).padStart(2,'0')}`;
  $('#btnStep').disabled = st.step >= SCENE.length-1;
}

function applyLang(){
  document.documentElement.lang = L;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('#lang').textContent = L === 'ko' ? 'EN' : 'KO';
  $('#btnPlay').textContent = playing ? t('pause') : t('play');
  buildOps();
  buildProse();
  buildGuide();
  if (st.step > 0) $('#nText').textContent = SCENE[st.step][L];
  render();
}

/* --- 조작 버튼 ------------------------------------------------------------ */

function buildOps(){
  for (const k of ['A','B']){
    const defs = [
      ['opBegin',  () => opBegin(k)],
      ['opSelect', () => opSelect(k)],
      ['opUpdate', () => opWrite(k,3,'update')],
      ['opDelete', () => opWrite(k,3,'delete')],
      ['opCommit', () => opCommit(k)],
    ];
    $('#ops'+k).innerHTML = '';
    for (const [key, fn] of defs){
      const b = document.createElement('button');
      b.textContent = t(key);
      b.onclick = () => { stop(); fn(); render(); };
      $('#ops'+k).appendChild(b);
    }
  }
}

/* --- 진행 ----------------------------------------------------------------- */

let playing = false, timer = null;

function stepOnce(){
  if (st.step >= SCENE.length-1){ stop(); return; }
  st.step++;
  SCENE[st.step].run();
  $('#nText').textContent = SCENE[st.step][L];
  render();
  if (st.step >= SCENE.length-1) stop();
}

function play(){
  playing = true;
  $('#btnPlay').textContent = t('pause');
  timer = setInterval(stepOnce, 2600);
}
function stop(){
  playing = false;
  clearInterval(timer);
  $('#btnPlay').textContent = t('play');
}

$('#btnPlay').onclick = () => playing ? stop() : play();
$('#btnStep').onclick = () => { stop(); stepOnce(); };
$('#btnVacuum').onclick = () => { stop(); opVacuum(); render(); };
$('#btnReset').onclick  = () => { stop(); reset(); $('#nText').textContent = t('nIntro'); render(); };
$('#lang').onclick = () => { L = L === 'ko' ? 'en' : 'ko'; applyLang(); };

/* ============================================================================
 * 4. 본문

function buildProse(){
  $('#prose').innerHTML = L === 'ko' ? PROSE_KO : PROSE_EN;
}


function buildGuide(){ document.querySelector('#guide').innerHTML = L === 'ko' ? GUIDE_KO : GUIDE_EN; }

   VACUUM        <em>→ 0. now B is blocking</em></div>
<p class="why">The horizon is set by the <strong>oldest</strong> open transaction. Killing one long transaction does not end it — the next oldest immediately takes over the role. Watch the blue chip move from A to B on the axis.</p>
</div>

<div class="recipe">
<h4>3. UPDATE is what creates bloat</h4>
<div class="seq">Reset
B  DELETE ×3 → COMMIT   (repeat a few times)
   Watch the size          <em>→ does not grow</em>

Reset
B  UPDATE ×3 → COMMIT   (same number of times)
   Watch the size          <em>→ pages appear</em></div>
<p class="why"><code>DELETE</code> only marks death; it writes no new tuple. <code>UPDATE</code> keeps the old version and writes a new one, so it consumes space <strong>at twice the rate</strong>. This is why bulk update jobs are the usual suspect.</p>
</div>

<div class="recipe">
<h4>4. Only trailing pages get truncated</h4>
<div class="seq">Reset
B  UPDATE ×3 → COMMIT   (repeat until pages grow)
   VACUUM

Check whether the last page is fully empty
Empty      → size drops, "truncated" appears in the log
One survivor → size unchanged</div>
<p class="why">VACUUM never moves data forward, so a hole in the middle of the file stays a hole. It can only cut from the end, and <strong>only when the end is completely empty</strong>.</p>
</div>

<div class="recipe">
<h4>5. Death is not settled until commit</h4>
<div class="seq">Reset
B  UPDATE ×3     <em>← do not commit</em>
   Look at slots  <em>→ 3 dashed (uncommitted) appear</em>
   Dead count 0   <em>← old versions still read as live</em>
   VACUUM        <em>→ nothing to do</em>

B  COMMIT        <em>→ 3 old versions finally die</em>
   VACUUM        <em>→ reclaimed</em></div>
<p class="why">Old versions cannot be removed before commit: <strong>a rollback would make them the correct answer again</strong>. The dashed slots are the opposite case — new versions nobody can see yet. Meanwhile that transaction pins the horizon with its own xid; check the axis.</p>
</div>
`;

<pre><code>SELECT pid, state, age(backend_xid) AS xid_age,

FROM pg_stat_activity
WHERE state != 'idle' OR backend_xid IS NOT NULL

LIMIT 10;</code></pre>

FROM pg_stat_user_tables
ORDER BY n_dead_tup DESC
LIMIT 10;</code></pre>

const PROSE_EN = `
<h2>PostgreSQL does not modify rows</h2>
<p>This trips up almost everyone arriving from another database. An <code>UPDATE</code> in PostgreSQL does not change the existing row. <strong>It stamps a death marker on the old version and writes a new version somewhere else.</strong> A <code>DELETE</code> likewise removes nothing — it only marks.</p>
<p>Every tuple carries two system columns you can select directly:</p>
<pre><code>SELECT xmin, xmax, * FROM orders LIMIT 5;</code></pre>
<ul>
<li><code>xmin</code> — the transaction that created this version</li>
<li><code>xmax</code> — the transaction that killed it (0 while still live)</li>
</ul>
<p>This is why readers never block writers: a reader simply picks the version matching its snapshot. The cost is <strong>garbage</strong>, and VACUUM is what collects it.</p>

<h2>Why VACUUM cannot just delete</h2>
<p>A dead tuple is not automatically removable. Some transaction may still be entitled to see that version.</p>
<p>So PostgreSQL computes a boundary: <strong>the oldest snapshot held by any currently open transaction</strong>. That is the <code>xmin horizon</code>. Anything that died after that line is untouchable.</p>
<div class="callout">One long-lived open transaction pins cleanup for the entire database at that moment — even if it does nothing at all. The effect is global, not limited to the tables it touched.</div>
<p>In the lab above, session A runs a single <code>SELECT</code> and then idles. Yet every dead tuple session B produces stays stuck. This is the most common bloat scenario in production.</p>

<h2>Reclaiming does not shrink the file</h2>
<p>When VACUUM removes dead tuples, the space becomes <strong>reusable</strong> — but the file does not get smaller. VACUUM never relocates data forward, so a hole in the middle stays a hole.</p>
<p>There is one exception: <strong>trailing pages that end up completely empty</strong> can be truncated and returned to the OS. Watch the lab for when page count drops and when it refuses to.</p>
<p>To actually get disk back you need one of:</p>
<ul>
<li><code>VACUUM FULL</code> — rewrites the whole table under an <strong>ACCESS EXCLUSIVE lock</strong>, blocking even reads, and needs free space roughly equal to the table</li>
<li><code>pg_repack</code> — the same result with essentially no downtime. Usually the production answer</li>
<li>For partitioned tables, <code>DROP</code> the partition</li>
</ul>

<h2>What to check in production</h2>
<p>If a table keeps growing and you cannot see why, look for old transactions first:</p>
<pre><code>SELECT pid, state, age(backend_xid) AS xid_age,
       now() - xact_start AS duration, query
FROM pg_stat_activity
WHERE state != 'idle' OR backend_xid IS NOT NULL
ORDER BY xact_start
LIMIT 10;</code></pre>
<p>An <code>idle in transaction</code> session sitting for hours is very likely your culprit — a connection that opened a transaction and never committed.</p>
<p>For the scale of the bloat:</p>
<pre><code>SELECT relname,
       n_live_tup, n_dead_tup,
       round(n_dead_tup * 100.0 / nullif(n_live_tup + n_dead_tup, 0), 1) AS dead_pct,
       last_autovacuum
FROM pg_stat_user_tables
ORDER BY n_dead_tup DESC
LIMIT 10;</code></pre>
<p>Prevention comes down to a short list:</p>
<ul>
<li>Set <code>idle_in_transaction_session_timeout</code>. Highest impact by far</li>
<li>Move long analytical queries to a read replica — but note <code>hot_standby_feedback</code> can push the replica's horizon back onto the primary</li>
<li>Keep transaction boundaries explicit in your connection pool, especially code that returns a connection with autocommit disabled</li>
<li>Batch large <code>UPDATE</code> statements so autovacuum can keep pace between chunks</li>
</ul>
<div class="callout">This model is simplified for teaching. Real PostgreSQL also deals with HOT updates, hint bits, freezing and multixacts. The mechanism that matters here — the <code>xmin horizon</code> blocking reclamation — works exactly as shown.</div>
`;
