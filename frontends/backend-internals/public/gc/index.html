<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>G1과 ZGC는 왜 다르게 멈추는가 — 힙을 키우면 무슨 일이 일어나나</title>
<meta name="description" content="힙 크기를 늘리면 G1의 STW는 길어지는데 ZGC는 왜 그대로인지, 그리고 ZGC가 공짜가 아닌 이유. Interactive G1 vs ZGC pause time visualization.">

<style>
.lab{margin:32px 0 8px;border:1px solid var(--rule);border-radius:4px;background:var(--paper-2);overflow:hidden}
.lab section{border-bottom:1px solid var(--rule);padding:16px 18px}
.lab section:last-child{border-bottom:none}
.cap{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px;display:block}

/* --- 손잡이 --- */
.dials{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:660px){ .dials{grid-template-columns:1fr;gap:16px} }
.dial label{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.dial label b{font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500}
.dial label b small{font-size:10px;color:var(--ink-3)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule)}

/* --- 타임라인 --- */

/* --- 단계 띠 --- */

.strip{display:flex;height:26px;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--paper)}

/* --- 조작대 --- */

/* --- 안내 --- */

<body>

<main class="wrap">

<script>
'use strict';

/* ============================================================================
 * 0. 문안
 * ========================================================================== */
const T = {
ko:{
  title:'G1과 ZGC는 왜 다르게 멈추는가',
  lede:'힙을 4GB에서 128GB로 키우면 G1의 정지 시간은 함께 자랍니다. ZGC는 거의 그대로예요. 왜 그런지, 그리고 그 대가로 무엇을 내는지 직접 확인합니다.',
  dHeap:'힙 크기', dAlloc:'할당 속도',
  capTimeline:'60초 동안의 STW 정지', capPhase:'한 사이클의 구성',
  phG1Note:'객체를 옮기는 동안 멈춘다', phZNote:'옮기는 일까지 동시에 한다',
  lgStw:'STW — 애플리케이션 정지', lgConc:'concurrent — 애플리케이션과 동시 실행',
  toLog:'로그 스케일로 보기', toLinear:'선형 스케일로 돌아가기',
  scaleLin:'선형 스케일 · 두 그래프가 같은 기준', scaleLog:'로그 스케일 · ZGC 막대를 보려면 필요',
  nMax:'최대 정지', nP99:'p99', nYoung:'young 정지', nMixed:'mixed 정지', nFull:'Full GC', nCount:'GC 횟수', nStw:'총 STW', nThru:'처리량', nStall:'할당 지연',
  play:'시나리오 재생', pause:'일시정지', step:'다음 단계', reset:'초기화',
  nIntro:'재생을 누르면 힙을 단계적으로 키우며 무슨 일이 일어나는지 보여줍니다. 슬라이더를 직접 움직여도 됩니다.',
  hintHeapS:'작은 힙 — 컨테이너나 마이크로서비스',
  hintHeapM:'중간 힙 — 일반적인 서버 애플리케이션',
  hintHeapL:'큰 힙 — 캐시, 인메모리 저장소',
  hintAllocS:'가벼운 부하',
  hintAllocM:'일반적인 웹 애플리케이션',
  hintAllocL:'ZGC 회수 능력을 넘어섰다 — 할당 지연 발생',
  hintG1Full:'G1이 따라가지 못한다 — Full GC 발생',
  foot:'JDK 25 기준 · 교육용 단순화 모델'
},
en:{
  title:'Why G1 and ZGC stop differently',
  lede:'Grow the heap from 4GB to 128GB and G1\u2019s pauses grow with it. ZGC barely moves. See why — and what it costs.',
  dHeap:'heap size', dAlloc:'allocation rate',
  capTimeline:'STW pauses over 60 seconds', capPhase:'Anatomy of one cycle',
  phG1Note:'stops the world while moving objects', phZNote:'moves objects concurrently too',
  lgStw:'STW — application stopped', lgConc:'concurrent — runs alongside the application',
  toLog:'Switch to log scale', toLinear:'Back to linear scale',
  scaleLin:'linear scale · both charts share one baseline', scaleLog:'log scale · needed to see ZGC at all',
  nMax:'max pause', nP99:'p99', nYoung:'young pause', nMixed:'mixed pause', nFull:'Full GC', nCount:'GC count', nStw:'total STW', nThru:'throughput', nStall:'alloc stall',
  play:'Play scenario', pause:'Pause', step:'Next step', reset:'Reset',
  nIntro:'Press play to walk up the heap sizes and watch what happens. The sliders are yours at any time.',
  hintHeapS:'small heap — containers, microservices',
  hintHeapM:'mid heap — ordinary server applications',
  hintHeapL:'large heap — caches, in-memory stores',
  hintAllocS:'light load',
  hintAllocM:'typical web application',
  hintAllocL:'past ZGC\u2019s concurrent reclaim rate — allocation stalls appear',
  hintG1Full:'G1 cannot keep up — Full GC fires',
  foot:'JDK 25 · simplified teaching model'
}};
let L='ko';
const t=(k,...a)=>{let s=T[L][k]??k;a.forEach((v,i)=>s=s.replaceAll('$'+(i+1),v));return s;};

/* ============================================================================
 * 1. 모델
 *
 *    G1  — 살아 있는 객체를 STW 중에 복사한다. 옮길 양이 곧 정지 시간이다.
 *          MaxGCPauseMillis 를 맞추려 young 영역을 줄이지만, 하한(힙의 5%)이
 *          있어서 힙이 커지면 결국 정지 시간이 따라 커진다.
 *
 *    ZGC — 색깔 포인터와 load barrier 덕에 이동까지 동시에 한다. STW 는 루트를
 *          훑는 짧은 구간뿐이고, JDK 16 이후 스택 스캔도 동시 수행이라
 *          힙 크기와 사실상 무관하다. 대신 회수 속도를 넘겨 할당하면 멈춘다.
 * ========================================================================== */

const HEAPS = [2,4,8,16,32,64,96,128];        // GB
const WINDOW = 60_000;                        // 관측 구간 (ms)

const P = {
  pauseTarget: 200,      // -XX:MaxGCPauseMillis 기본값
  copyMBperMS: 2.0,      // 복사 처리량
  survive: 0.15,         // young 중 살아남는 비율
  g1Fixed: 2,            // 고정 비용
  g1RootPerGB: 0.35,     // 힙에 비례하는 부분 (RSet, 리전 메타데이터)
  g1MinYoung: 0.05,      // G1NewSizePercent
  g1MaxYoung: 0.60,      // G1MaxNewSizePercent
  mixedEvery: 4,         // mixed 수집 주기 (관측 구간에 반드시 들어오도록)
  mixedFactor: 1.7,
  g1FullThreshold: 0.35, // GC 점유율이 이걸 넘으면 따라가지 못한다
  fullGCperGB: 42,       // Full GC 시간 (ms/GB)

  zPause: 0.28,          // 사이클당 STW 하나 (힙과 무관)
  zPausesPerCycle: 3,    // Mark Start / Mark End / Relocate Start
  zTrigger: 0.30,        // 힙의 이 비율을 소비하면 사이클 시작
  zReclaimMBs: 2000,     // 동시 회수 처리량
};

function simulate(heapGB, allocMBs){
  const heapMB = heapGB*1024;
  const ev = { g1:[], z:[] };

  /* --- G1 --- */
  const ideal = P.pauseTarget * P.copyMBperMS / P.survive;
  const young = Math.min(Math.max(ideal, heapMB*P.g1MinYoung), heapMB*P.g1MaxYoung);
  const youngPause = P.g1Fixed + (young*P.survive)/P.copyMBperMS + heapGB*P.g1RootPerGB;
  const interval = young/allocMBs*1000;
  const overhead = youngPause/interval;
  const fullPause = heapGB*P.fullGCperGB;

  let tms = interval, i = 0;
  while (tms < WINDOW){
    const mixed = (i % P.mixedEvery === P.mixedEvery-1);
    ev.g1.push({ t:tms, ms: mixed ? youngPause*P.mixedFactor : youngPause, kind: mixed?'mixed':'young' });
    tms += interval; i++;
  }
  if (overhead > P.g1FullThreshold){
    const n = Math.max(1, Math.floor(overhead/P.g1FullThreshold));
    for (let k=1;k<=n;k++) ev.g1.push({ t: WINDOW*k/(n+1), ms: fullPause, kind:'full' });
    ev.g1.sort((a,b)=>a.t-b.t);
  }

  /* --- ZGC --- */
  // ZGC 는 소비량 기준 외에 주기적으로도 사이클을 돈다(proactive). 상한을 둔다.
  const zInterval = Math.min(20000, Math.max(500, heapMB*P.zTrigger/allocMBs*1000));
  let zt = zInterval;
  while (zt < WINDOW){
    for (let k=0;k<P.zPausesPerCycle;k++)
      ev.z.push({ t: zt + k*(zInterval*0.18), ms: P.zPause, kind:'z' });
    zt += zInterval;
  }
  // 힙이 넓을수록 사이클을 끝낼 시간이 생긴다 → 흡수 가능한 할당량이 는다
  const effReclaim = P.zReclaimMBs * (1 + Math.log2(Math.max(1, heapGB/8)) * 0.18);
  const excess = Math.max(0, allocMBs - effReclaim);
  const stallPerSec = excess > 0 ? (excess/allocMBs)*1000 : 0;

  return { ev, heapGB, allocMBs, young, youngPause, mixedPause: youngPause*P.mixedFactor,
           effReclaim, interval, overhead, stallPerSec,
           g1Full: overhead > P.g1FullThreshold };
}

const stats = (list, extraStallMs=0) => {
  if (!list.length) return { max:0, p99:0, n:0, stw:0, thru:100 };
  const s = list.map(e=>e.ms).sort((a,b)=>a-b);
  const stw = s.reduce((a,b)=>a+b,0) + extraStallMs;
  return {
    max: s[s.length-1],
    p99: s[Math.min(s.length-1, Math.floor(s.length*0.99))],
    n: list.length,
    stw,
    thru: Math.max(0, 100 - stw/WINDOW*100),
  };
};

/* ============================================================================
 * 2. 그리기
 * ========================================================================== */

const $ = s => document.querySelector(s);
let logScale = false;
let sim;

const fmt = ms => ms >= 1000 ? (ms/1000).toFixed(2)+'s' : ms >= 10 ? Math.round(ms)+'ms' : ms.toFixed(2)+'ms';

function plot(el, events, ceil){
  const H = 96, W = 1000;
  const y = ms => {
    if (!logScale) return Math.max(1, ms/ceil*(H-8));
    const lo = 0.05;
    return Math.max(1, (Math.log10(Math.max(ms,lo))-Math.log10(lo)) / (Math.log10(ceil)-Math.log10(lo)) * (H-8));
  };
  const bars = events.map(e => {
    const h = Math.min(H-6, y(e.ms));
    const x = e.t/WINDOW*W;
    const w = e.kind==='full' ? 6 : e.kind==='z' ? 2.5 : 4;
    const fill = e.kind==='full' ? 'var(--blocked)'
               : e.kind==='mixed' ? 'var(--free)'
               : e.kind==='z' ? 'var(--horizon)' : 'var(--ink-2)';
    return `<rect x="${x.toFixed(1)}" y="${(H-h).toFixed(1)}" width="${w}" height="${h.toFixed(1)}" fill="${fill}"/>`;
  }).join('');
  el.innerHTML = `<line x1="0" y1="${H-0.5}" x2="${W}" y2="${H-0.5}" stroke="var(--rule)"/>${bars}`;
}

function phaseStrip(el, segs){
  const total = segs.reduce((a,s)=>a+s.ms,0);
  el.innerHTML = segs.map(s => {
    const pct = Math.max(0.35, s.ms/total*100);
    const label = pct > 9 ? s.name : '';
    return `<div class="${s.stw?'stw':'conc'}" style="width:${pct}%" title="${s.name} · ${fmt(s.ms)}">${label}</div>`;
  }).join('');
}

function render(){
  const heapGB = HEAPS[+$('#sHeap').value];
  const allocMBs = +$('#sAlloc').value;
  sim = simulate(heapGB, allocMBs);

  $('#vHeap').innerHTML = `${heapGB}<small> GB</small>`;
  $('#vAlloc').innerHTML = `${allocMBs}<small> MB/s</small>`;
  $('#hHeap').textContent = heapGB<=8 ? t('hintHeapS') : heapGB<=32 ? t('hintHeapM') : t('hintHeapL');
  const ha = $('#hAlloc');
  if (sim.g1Full){ ha.textContent = t('hintG1Full'); ha.className='hint warn'; }
  else if (sim.stallPerSec>0){ ha.textContent = t('hintAllocL'); ha.className='hint warn'; }
  else { ha.textContent = allocMBs<=400 ? t('hintAllocS') : t('hintAllocM'); ha.className='hint'; }

  const sG1 = stats(sim.ev.g1);
  const sZ  = stats(sim.ev.z, sim.stallPerSec*60);
  const ceil = logScale ? Math.max(sG1.max, 10) : Math.max(sG1.max, 1);

  plot($('#pG1'), sim.ev.g1, ceil);
  plot($('#pZ'),  sim.ev.z,  ceil);
  $('#scaleNote').textContent = logScale ? t('scaleLog') : t('scaleLin');
  $('#btnScale').textContent = logScale ? t('toLinear') : t('toLog');

  const num = (k,v,bad) => `<span class="${bad?'bad':''}">${t(k)} <b>${v}</b></span>`;
  $('#nG1').innerHTML =
    num('nYoung', fmt(sim.youngPause), sim.youngPause > P.pauseTarget*1.1) +
    num('nMixed', fmt(sim.mixedPause)) +
    (sim.g1Full ? num('nFull', fmt(sG1.max), true) : '') +
    num('nCount', sG1.n) +
    num('nStw', fmt(sG1.stw)) +
    num('nThru', sG1.thru.toFixed(1)+'%', sG1.thru<90);
  $('#nZ').innerHTML =
    num('nMax', fmt(sZ.max)) +
    num('nCount', sZ.n) +
    num('nStw', fmt(sim.ev.z.reduce((a,e)=>a+e.ms,0))) +
    (sim.stallPerSec>0 ? num('nStall', Math.round(sim.stallPerSec)+'ms/s', true) : '') +
    num('nThru', sZ.thru.toFixed(1)+'%', sZ.thru<90);

  // 한 사이클의 구성 — 실제 비율대로
  const yp = sim.youngPause;
  phaseStrip($('#stripG1'), [
    { name:'Young Evacuation', ms: yp, stw:true },
    { name:'Concurrent Mark',  ms: yp*6, stw:false },
    { name:'Remark',           ms: yp*0.18, stw:true },
    { name:'Concurrent Cleanup', ms: yp*1.2, stw:false },
    { name:'Mixed Evacuation', ms: yp*P.mixedFactor, stw:true },
  ]);
  const zp = P.zPause;
  phaseStrip($('#stripZ'), [
    { name:'Mark Start',            ms: zp, stw:true },
    { name:'Concurrent Mark',       ms: zp*90, stw:false },
    { name:'Mark End',              ms: zp, stw:true },
    { name:'Concurrent Prepare',    ms: zp*24, stw:false },
    { name:'Relocate Start',        ms: zp, stw:true },
    { name:'Concurrent Relocate',   ms: zp*70, stw:false },
  ]);
}

let step = 0, playing = false, timer = null;

function applyStep(){
  const s = SCENE[step];
  $('#sHeap').value = s.heap;
  $('#sAlloc').value = s.alloc;
  $('#nText').textContent = s[L];
  $('#nStep').textContent = `${String(step+1).padStart(2,'0')} / ${String(SCENE.length).padStart(2,'0')}`;
  $('#btnStep').disabled = step >= SCENE.length-1;
  render();
}
function stepOnce(){
  if (step >= SCENE.length-1){ stop(); return; }
  step++; applyStep();
  if (step >= SCENE.length-1) stop();
}
function play(){ playing=true; $('#btnPlay').textContent=t('pause'); timer=setInterval(stepOnce, 3400); }
function stop(){ playing=false; clearInterval(timer); $('#btnPlay').textContent=t('play'); }

$('#btnPlay').onclick = () => playing?stop():play();
$('#btnStep').onclick = () => { stop(); stepOnce(); };
$('#btnReset').onclick = () => { stop(); step=0; applyStep(); };
$('#btnScale').onclick = () => { logScale=!logScale; render(); };
$('#sHeap').oninput = () => { stop(); render(); };
$('#sAlloc').oninput = () => { stop(); render(); };
$('#lang').onclick = () => { L = L==='ko'?'en':'ko'; applyLang(); };

function applyLang(){
  document.documentElement.lang = L;
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  $('#lang').textContent = L==='ko'?'EN':'KO';
  $('#btnPlay').textContent = playing?t('pause'):t('play');
  $('#guide').innerHTML = L==='ko'?GUIDE_KO:GUIDE_EN;
  $('#prose').innerHTML = L==='ko'?PROSE_KO:PROSE_EN;
  $('#nText').textContent = step===0 ? t('nIntro') : SCENE[step][L];
  render();
}

<li><strong>JDK 21</strong> — 세대별 ZGC 도입 (JEP 439). 이전 ZGC는 세대 구분이 없어서 짧게 살다 죽는 객체도 매번 전체 힙을 훑어야 했습니다. 이게 ZGC의 처리량 약점이었어요</li>
<li><strong>JDK 23</strong> — 세대별 모드가 기본값 (JEP 474)</li>
<li><strong>JDK 24</strong> — 비세대 모드 제거 (JEP 490). 이제 <code>-XX:+UseZGC</code>는 곧 세대별 ZGC입니다</li>
<li><strong>JDK 25</strong> — 현재 LTS. G1은 여전히 기본 수집기입니다</li>
</ul>
<div class="callout">"ZGC는 처리량이 많이 떨어진다"는 인상은 대부분 세대별 도입 이전 자료에서 온 것입니다. JDK 21 이후로는 격차가 상당히 줄었어요. 다만 여전히 0은 아니니 직접 측정하는 게 맞습니다.</div>

<h2>현장에서 확인할 것</h2>
<p>먼저 지금 뭘 쓰고 있고 얼마나 멈추는지 봅니다.</p>
<pre><code>// 실행 중인 JVM
jcmd &lt;pid&gt; VM.flags | tr ' ' '\\n' | grep -i gc

// GC 로그 켜기 (JDK 9+)
-Xlog:gc*:file=gc.log:time,uptime,level,tags:filecount=5,filesize=20M

// 안전점(safepoint) 까지 보려면 — STW 는 GC 만의 것이 아니다
-Xlog:safepoint:file=safepoint.log</code></pre>
<p>두 번째 로그가 중요합니다. 스레드 덤프, 바이어스드 락 해제, JIT 디옵티마이제이션도 STW를 만듭니다. GC 로그만 보고 "정지가 없다"고 결론 내리면 놓치는 게 생겨요.</p>
<p>ZGC를 쓰신다면 할당 지연을 따로 봐야 합니다.</p>
<pre><code>-Xlog:gc+alloc=debug   // Allocation Stall 항목이 찍힌다</code></pre>
<p>바꿀지 판단하는 기준은 대략 이렇습니다.</p>
<ul>
<li>힙이 32GB를 넘고 p99 지연이 문제라면 → ZGC를 재볼 가치가 있습니다</li>
<li>힙이 8GB 이하라면 → G1으로 충분합니다. ZGC의 이점이 barrier 비용을 상쇄하기 어렵습니다</li>
<li>배치·ETL처럼 총 처리 시간이 지표라면 → G1, 또는 Parallel GC까지 고려</li>
<li>Full GC가 찍히고 있다면 → 수집기를 바꾸기 전에 <strong>왜 따라가지 못하는지</strong>부터 봅니다. 대개 할당 속도나 누수가 원인이고, 수집기를 바꿔도 해결되지 않습니다</li>
</ul>
<div class="callout">이 페이지의 수치는 개념을 보여주기 위한 단순 모델입니다. 실제 정지 시간은 객체 그래프 모양, 리전 크기, GC 스레드 수, 하드웨어에 따라 크게 달라집니다. <strong>본인 워크로드로 측정하는 것을 대신할 수 있는 건 없습니다.</strong></div>
`;

const PROSE_EN = `
<h2>Where G1 stops</h2>
<p>G1 divides the heap into uniform <strong>regions</strong>. To collect, it picks a set of regions and <strong>copies</strong> the live objects out into fresh ones, then frees the originals wholesale.</p>
<p>The catch is that copying changes addresses. Application threads must not be holding stale ones, so <strong>the world stays stopped for the entire copy.</strong> Pause time is simply "how much live data got moved".</p>
<pre><code>pause ≈ fixed cost + (live bytes to copy) / copy throughput</code></pre>
<p>G1 resizes the young generation to hit <code>-XX:MaxGCPauseMillis</code> (200ms by default), shrinking it when it overshoots. That adaptation is why the target holds up to 16GB in the lab above.</p>
<div class="callout">But the young generation has a floor. <code>G1NewSizePercent</code> defaults to 5%, and 5% of a 128GB heap is already 6.4GB. Copying even the 15% that survives is close to a gigabyte. That is how <strong>the target becomes unreachable</strong>.</div>

<h2>How ZGC avoids stopping</h2>
<p>ZGC rests on <strong>colored pointers</strong> and a <strong>load barrier</strong>.</p>
<p>A 64-bit pointer only needs about 44 bits for the real address. ZGC stores state in the spare high bits — whether this object has been marked, whether it has already been relocated. Every reference read in the application carries a small check of those bits.</p>
<pre><code>// conceptually, this check rides along with every reference load
Object o = obj.field;        // ← barrier runs here
// if the pointer colour is stale: find the new address and fix the reference in place
</code></pre>
<p>This is what lets <strong>the application keep running while objects are being moved.</strong> A thread reaching a stale address gets forwarded on the spot, and its reference is healed.</p>
<p>So ZGC's STW work is three short root-scanning windows per cycle. Since JDK 16 even thread stack scanning is concurrent, which makes the pause <strong>essentially independent of both heap size and thread count</strong>.</p>

<h2>So should everything use ZGC</h2>
<p>No. There are three costs.</p>
<ul>
<li><strong>Throughput</strong> — the load barrier rides on every reference read, costing roughly 5–15% depending on the workload. For batch jobs measured in total time, that is a straight loss</li>
<li><strong>Memory</strong> — allocation continues during collection, so ZGC needs headroom. Expect to give it more heap than G1 for the same job</li>
<li><strong>Allocation stalls</strong> — the ones in the lab above. Outrun the collector and you stop anyway</li>
</ul>
<table class="keytable">
<tr><th></th><th>G1</th><th>ZGC</th></tr>
<tr><td>pause</td><td>tens to hundreds of ms, scales with heap</td><td>sub-millisecond, heap-independent</td></tr>
<tr><td>throughput</td><td>better</td><td>5–15% worse</td></tr>
<tr><td>bigger heap</td><td>longer pauses</td><td>generally a win</td></tr>
<tr><td>fits</td><td>general servers, batch, 4–32GB</td><td>latency-sensitive, large heaps, caches</td></tr>
</table>

<h2>What changed by JDK version</h2>
<p>ZGC has moved a great deal recently, so old benchmarks mislead.</p>
<ul>
<li><strong>JDK 21</strong> — Generational ZGC arrives (JEP 439). Before this, ZGC had no generations at all, so short-lived garbage forced a full-heap traversal every time. That was its throughput weakness</li>
<li><strong>JDK 23</strong> — generational mode becomes the default (JEP 474)</li>
<li><strong>JDK 24</strong> — non-generational mode removed (JEP 490). <code>-XX:+UseZGC</code> now means generational ZGC</li>
<li><strong>JDK 25</strong> — current LTS. G1 remains the default collector</li>
</ul>
<div class="callout">The reputation that "ZGC costs a lot of throughput" mostly comes from pre-generational measurements. The gap narrowed considerably after JDK 21 — though it is not zero, so measure rather than assume.</div>

<h2>What to check in production</h2>
<p>Start with what you are actually running and how much it stops.</p>
<pre><code>// live JVM
jcmd &lt;pid&gt; VM.flags | tr ' ' '\\n' | grep -i gc

// GC logging (JDK 9+)
-Xlog:gc*:file=gc.log:time,uptime,level,tags:filecount=5,filesize=20M

// safepoints too — STW is not only GC
-Xlog:safepoint:file=safepoint.log</code></pre>
<p>That second one matters. Thread dumps, biased lock revocation and JIT deoptimisation all stop the world. Concluding "no pauses" from the GC log alone leaves things out.</p>
<p>On ZGC, watch stalls separately:</p>
<pre><code>-Xlog:gc+alloc=debug   // Allocation Stall entries</code></pre>
<p>Rules of thumb for switching:</p>
<ul>
<li>Heap over 32GB and p99 latency hurting → ZGC is worth measuring</li>
<li>Heap at or under 8GB → G1 is fine; ZGC's benefit rarely covers the barrier cost</li>
<li>Batch or ETL where total time is the metric → G1, or even Parallel GC</li>
<li>Seeing Full GCs → find out <strong>why it cannot keep up</strong> before changing collectors. Usually it is allocation rate or a leak, and a new collector will not fix either</li>
</ul>
<div class="callout">The numbers here come from a simplified teaching model. Real pauses depend on object graph shape, region size, GC thread count and hardware. <strong>Nothing substitutes for measuring your own workload.</strong></div>
