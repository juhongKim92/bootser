# dday-static 공휴일·황금연휴 자료 갱신
#
# Nager.Date 를 호출하는 유일한 자동 경로다. 사이트 빌드(Cloudflare)에서는 부르지
# 않는다 — 빌드마다 1224번(204개국 × 3년 × 공휴일·연휴) 치면 자료가 조용히
# 바뀌어 배포된다.
# 여기서 한 달에 한 번만 받아 커밋하고, 그 커밋이 Cloudflare 배포를 깨운다.
#
# 자료가 그대로면 아무것도 커밋하지 않는다. 검사가 실패하면 밀지 않는다.

name: dday-static 공휴일·연휴 갱신

on:
  schedule:
    - cron: '0 3 1 * *'      # 매월 1일 03:00 UTC (KST 정오)
  workflow_dispatch:          # 손으로도 돌릴 수 있게

permissions:
  contents: write

concurrency:
  group: dday-static-refresh
  cancel-in-progress: false   # 커밋하는 작업이라 중간에 끊지 않는다

defaults:
  run:
    working-directory: frontends/dday-static

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gen-sitemap.mjs 가 파일마다 `git log -1` 로 lastmod 를 뽑는다.
          # 얕은 클론이면 이력이 없어 전부 오늘로 찍히고, 구글은 부정확한
          # lastmod 를 아예 무시한다.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # 의존성이 없다. npm install 도, 캐시도 필요 없다.

      - name: Nager.Date 에서 자료 받기 (공휴일 · 황금연휴)
        run: node tools/gen-holidays.mjs

      # 네트워크를 타지 않는다. 절기·삭망은 astro.mjs 가 직접 계산한다.
      # 해가 바뀌면 담는 3년이 밀리므로 갱신 때마다 같이 돌린다.
      - name: 절기·삭망 다시 계산하기
        run: node tools/gen-sky.mjs

      - name: 페이지 다시 만들기
        run: node tools/gen-pages.mjs

      - name: 바뀐 게 있나
        id: diff
        run: |
          if git status --porcelain . | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- . | tail -1
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "자료가 그대로다 — 커밋할 것이 없다."
          fi

      - name: 커밋
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .
          git commit \
            -m "chore(frontends): dday-static 공휴일·연휴 자료 갱신 ($(date -u +%Y-%m))" \
            -m "Nager.Date 에서 새로 받았습니다. tools/gen-holidays.mjs → gen-pages.mjs." \
            -m ".github/workflows/dday-static-refresh.yml 가 매월 1일에 돌립니다."

      # 순서가 중요하다. lastmod 는 커밋 날짜에서 뽑으므로 커밋 뒤에 만들어야
      # 하고, 그러면 sitemap.xml 자체가 커밋 안 된 상태로 남아 amend 로 합친다.
      - name: sitemap 다시 만들기
        if: steps.diff.outputs.changed == 'true'
        run: node tools/gen-sitemap.mjs

      - name: 검사 — 실패하면 밀지 않는다
        if: steps.diff.outputs.changed == 'true'
        run: node tools/check-pages.mjs

      - name: sitemap 을 같은 커밋에 합치기
        if: steps.diff.outputs.changed == 'true'
        run: |
          if ! git diff --quiet; then
            git add -A .
            git commit --amend --no-edit
          fi

      - name: 푸시
        if: steps.diff.outputs.changed == 'true'
        run: git push
